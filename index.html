<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner (Ultimate Master)</title>
    <script src='https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js'></script>
    <style>
        :root { --mon-red: #b71c1c; --mon-gold: #ffc107; }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f4f6f8; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 900px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 8px solid var(--mon-red); }
        h2 { color: var(--mon-red); text-align: center; margin-bottom: 20px; font-weight: bold; }
        
        .upload-section { border: 2px dashed #cfd8dc; padding: 25px; text-align: center; border-radius: 8px; margin-bottom: 20px; background: #fafafa; cursor: pointer; transition: 0.2s; }
        .upload-section:hover { background-color: #eee; border-color: var(--mon-red); }
        #preview-image { max-width: 100%; max-height: 300px; margin-top: 15px; display: none; border-radius: 8px; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.3s; }
        #scan-btn { background-color: var(--mon-red); color: white; }
        #scan-btn:hover { background-color: #8e1616; }
        #copy-btn { background-color: #2e7d32; color: white; display: none; }
        #copy-btn:hover { background-color: #1b5e20; }
        
        #output-text { width: 100%; height: 600px; padding: 20px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; line-height: 2; font-family: "Pyidaungsu", "Mon3", serif; white-space: pre-wrap; background-color: #fff; }
        .status { text-align: center; color: #555; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR Scanner (Master Fix)</h2>
    
    <div class="upload-section" onclick="document.getElementById('uploader').click()">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()" style="display:none">
        <p>📂 ဍဵုဒၞာဲဏအ် သွက်ဂွံရုဲဗီုရုပ် (Click to Upload)</p>
        <img id="preview-image" alt="Preview">
    </div>

    <button id="scan-btn" onclick="performOCR()">Scan & Fix (100% Clean)</button>
    <p id="status" class="status">မင်မံင်ဗီုရုပ်...</p>
    <textarea id="output-text" placeholder="လိက်မန် သ္အးသ္အးဇ္ၚးဇ္ၚး တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
    <button id="copy-btn" onclick="copyToClipboard()">📋 ကူကေတ်လိက် (Copy Text)</button>
</div>

<script>
    function fixMonScript(text) {
        if (!text) return "";
        let fixed = text;

        // ၁. Master Dictionary (ပကောံလဝ် လိက်ဓရ်၊ လောကနဳတိ၊ လိက်ဝင်)
        const dictionary = [
            // --- General Fixes (ဝေါဟာရ အဓိက) ---
            { w: "ကို", r: "ကဵု" },
            { w: "ပ္ကဲ့", r: "ပ္ဍဲ" }, { w: "ပ္ကဲ", r: "ပ္ဍဲ" }, { w: "ပ္လဲ", r: "ပ္ဍဲ" }, { w: "ပ္ထဲ", r: "ပ္ဍဲ" },
            { w: "သွဝ်ကျာ", r: "သၟဝ်ကျာ" }, { w: "သၞဝ်ကျာ", r: "သၟဝ်ကျာ" }, { w: "သၞဝ်", r: "သၟဝ်" },
            { w: "ပှန်", r: "ပၠန်" }, { w: "ပၠနိ", r: "ပၠန်" },
            { w: "မသ်္သေ့ဒံၚ်", r: "မသှ်ေသၟေဟ်ဒၟံၚ်" }, { w: "မသ်္သေ့", r: "မသှ်ေသၟေဟ်" },
            { w: "သၞေဟ်ဒၞံၚ်", r: "သၟေဟ်ဒၟံင်" }, { w: "သ်ေေ", r: "သှ်ေ" },
            { w: "စီ", r: "ၜဳ" },
            { w: "တွဟ်", r: "တၞဟ်" }, { w: "ဆတသမု", r: "တၞဟ်" },
            { w: "တွေၚ်", r: "တၟေၚ်" }, { w: "တဲ်", r: "တ္ၚဲ" },
            { w: "ဇှှော်", r: "ဇၞော်" }, { w: "ဇွော်", r: "ဇၞော်" },
            { w: "သၠာ", r: "သၞာံ" }, { w: "အခၚ", r: "အခိင်" }, { w: "ဟု", r: "ဟီု" },
            { w: "တ္မအ", r: "တၟအ်" }, { w: "တုံ", r: "တုဲ" }, { w: "တဲဲ", r: "တုဲ" },
            { w: "ချၚ်", r: "ဍုင်" }, { w: "ဗၞာ", r: "ဗၟာ" }, { w: "ဗ္ဗာ", r: "ဗၟာ" },
            { w: "လံ", r: "လဴ" }, { w: "လေ", r: "လဴ" },

            // --- History & Dvaravati Terms (လိက်ဝင်) ---
            { w: "ဗၞဝ်ကၠ", r: "ဗွဝ်ကၠံ" }, { w: "ဗၞဝ်ကၠံ", r: "ဗွဝ်ကၠံ" },
            { w: "ဒၞါရ၀", r: "ဒွါရဝတဳ" }, { w: "ဒၞါရဝတီ", r: "ဒွါရဝတဳ" },
            { w: "သၞိုၚ်", r: "သၟိင်" }, { w: "သေထာ", r: "သေံထာဲ" },
            { w: "ဒၞာချၚဗၟာ", r: "ဒၞာဲဍုင်ဗၟာ" }, { w: "နဒဒှ်", r: "နဒဒှ်" },
            { w: "မၞဲ", r: "မွဲ" }, { w: "ရေၚ်သကအ်", r: "ရေင်သကအ်" },
            { w: "ဟုပ္ပ", r: "ဟီုဂွံ" }, { w: "ဂၞံရ", r: "ဂွံရ" },

            // --- Loka Niti Terms (လောကနဳတိ) ---
            { w: "နဒါန်", r: "နိဒါန်" }, { w: "ကောနိ", r: "ကောန်" }, { w: "မနိ", r: "မန်" },
            { w: "ဉံလေဝ်", r: "နွံလေဝ်" }, { w: "ဉံ", r: "နွံ" }, { w: "နွံတၱ", r: "နွံတဴ" },
            { w: "ခွဲမွဲသ်ို", r: "ခိုဟ်မွဲသီု" }, { w: "ဒတာလျိုၚ်", r: "ဒတာလျိုင်" },
            { w: "ယာဲက္လတ", r: "မိမယာဲကလ" }, { w: "မၚိှံၟ", r: "မင်မိ" },
            { w: "လှ္ဂို", r: "လ္ၚဵု" }, { w: "သာသ္ပံ", r: "သာသ္ပ" }, { w: "၄ၚ်", r: "နူ" },
            { w: "ပ္ဒဲ", r: "ပ္ဍဲ" }, { w: "ဒှိအာ", r: "ဒှ်အာ" }, { w: "သွးသွး", r: "သၟးသၟး" },
            { w: "မွိုဟ်", r: "မၞိဟ်" }, { w: "ဂလာနိ", r: "ဂလာန်" }, { w: "အပြောံ", r: "အပြောံ" },
            { w: "ချန်ပုၚ်", r: "ချက်ပုင်" }, { w: "ဟောံဗြံ", r: "ဟောံဗြမ်" },
            { w: "ဗ္ဘောနိ", r: "ဗ္တောန်" }, { w: "ဗ္တောနိ", r: "ဗ္တောန်" },
            { w: "အွာလောကနိတိ", r: "အ္စာလောကနဳတိ" }, { w: "အ္စွာ", r: "အ္စာ" },
            { w: "လ္ဒတ်", r: "လ္ၚတ်" }, { w: "လူှတ်ၟ", r: "လ္ၚတ်" }, { w: "မ္ဗတ်", r: "မ္ၚတ်" },
            { w: "ပ္ဘႆ", r: "မုဟီု" }, { w: "သိပ္ပံ", r: "သိပ္ပံ" },
            { w: "ဒုတိယရေဒံ", r: "ဒုတိယအဝဲ" }, { w: "ၚံဓဝ်", r: "ဓဝ်" }, { w: "ဓၚ်", r: "ဓဝ်" },
            { w: "မာနိ", r: "မာန်" }, { w: "စိုၚ်", r: "စိုပ်" }, { w: "စိုဝ်", r: "စိုပ်" },
            { w: "ဘဝယ်", r: "အဝယ်" }, { w: "လောနိ", r: "လောန်" },
            { w: "ကှောနိ", r: "ကၠောန်" }, { w: "ဌိုတ်", r: "ဟိုတ်" },
            { w: "ဆဝ်ဗ္ဂုဟ်", r: "ဆဝ်မ္ၚုဟ်" }, { w: "ပ္တိုက်ဖအောၚ်", r: "ပ္တိုက်ဖအောဝ်" },
            { w: "ကောနိၚ္ဂာ်", r: "ကောန်ၚာ်" }, { w: "ဒုၚိ", r: "ဒုင်" }, { w: "ခောတ်", r: "ခေတ်" },
            { w: "အလက်", r: "အလန်" },

            // Fix Punctuation Noise (ပလီုလိက်အု)
            { w: "ရႈ", r: "ရ။" }, { w: "ရၟ", r: "ရ။" }, { w: "ရၤ", r: "ရ။" },
            { w: "ရ11", r: "ရ။" }, { w: "ရ1", r: "ရ။" }, { w: "ရ#", r: "ရ။" }
        ];

        dictionary.forEach(item => {
            let regex = new RegExp(item.w, "g");
            fixed = fixed.replace(regex, item.r);
        });

        // ၂. Standard Character Cleanup (ပလေဝ်သဒ္ဒါသဇိုင်)
        fixed = fixed
            .replace(/([က-အ])နိ(?=[^က-အ]|\s)/g, "$1န်") // ကောနိ -> ကောန်
            .replace(/က္လ/g, "ကလ")
            .replace(/င/g, "ၚ").replace(/ၺ/g, "ည").replace(/ၡ/g, "ၝ").replace(/ၢ/g, "ၟ")
            .replace(/ွ/g, "ၞ")
            .replace(/ဂ်/g, "ဂှ်").replace(/့/g, "်").replace(/ဲံ/g, "ဲ")
            .replace(/ဴ/g, "ဵ").replace(/ို/g, "ို")
            .replace(/္ဘ/g, "္တ").replace(/ၟၟ/g, "ၟ");

        // ၃. Noise Filter (ပလီုလိက်အကြုက်)
        const lines = fixed.split('\n');
        const cleanLines = lines.filter(line => {
            let s = line.trim();
            if (s.length === 0) return false;
            // ယဝ်ရ Line ဂှ် နွံဆသင်္ချာ ကေုာံ သင်္ကေတ သၟးမ္ဂး ပလီုထောံ
            let validMonChars = (s.match(/[က-အ]/g) || []).length;
            if (validMonChars < 2) return false; 
            return true;
        });

        return cleanLines.join('\n');
    }

    // --- Helper Functions ---
    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = "ဗီုရုပ်အောပ်လုပ်တုဲရ၊ ဍဵု Scan ညိ";
        }
    }

    function copyToClipboard() {
        const output = document.getElementById("output-text");
        navigator.clipboard.writeText(output.value).then(() => {
            const btn = document.getElementById("copy-btn");
            btn.innerText = "✅ ကူကေတ်တုဲရ!";
            setTimeout(() => { btn.innerText = "📋 ကူကေတ်လိက် (Copy Text)"; }, 2000);
        });
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');
        const copyBtn = document.getElementById('copy-btn');

        if (!file) { alert("ရွေးဗီုရုပ်မွဲမွဲညိ"); return; }

        btn.disabled = true;
        status.innerText = "⏳ စက်မံင်ပလေဝ်လိက်... (Processing)...";
        output.value = "";
        
        try {
            const { data: { text } } = await Tesseract.recognize(file, 'mya', {
                logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဗှ်မံင်: ${Math.round(m.progress * 100)}%`; }
            });
            
            output.value = fixMonScript(text);
            status.innerText = "✅ Scan တုဲဒှ်ရ! (Master Fix)";
            copyBtn.style.display = "block";
        } catch (err) {
            status.innerText = "❌ Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
