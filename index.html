<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner (Pro Fix)</title>
    <script src='https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js'></script>
    <style>
        :root { --mon-red: #d32f2f; }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 800px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--mon-red); }
        h2 { color: var(--mon-red); margin-top: 0; text-align: center; }
        .upload-box { border: 2px dashed #bbb; padding: 20px; border-radius: 8px; background: #fff; margin-bottom: 20px; text-align: center; }
        #preview-image { max-width: 100%; max-height: 300px; margin-top: 10px; display: none; }
        button { background-color: var(--mon-red); color: white; border: none; padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        #output-text { width: 100%; height: 350px; margin-top: 20px; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; line-height: 1.6; font-family: "Pyidaungsu", "Mon3", serif; }
        .status { font-weight: bold; color: #555; margin: 15px 0; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR Scanner (Pro Fix)</h2>
    <div class="upload-box">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()">
        <br>
        <img id="preview-image" alt="Image Preview">
    </div>
    <button id="scan-btn" onclick="performOCR()">Scan လိက် (Start)</button>
    <p id="status" class="status">ဍဵုခလုတ် "Scan လိက်" သွက်ဂွံစ...</p>
    <textarea id="output-text" placeholder="လိက်မန် တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
</div>

<script>
    // ၁. Function ပလေဝ်လိက် နကဵု "အဘိဓာန်မန်" (Advanced Logic)
    function fixMonScript(text) {
        if (!text) return "";

        let fixed = text;

        // --- Step A: ပလေဝ်မအရေဝ် အတိုင်မၞးကဵုလဝ် (Word Replacement) ---
        // ဍေံဗှ်ဒး "ဗၠေတ်" -> ပြံင်ကဵု "ဒး"
        const replacements = [
            // အက္ခရ် သၟဝ်/သၞဝ်/လၟုဟ်
            { w: "လၞုဟ်", r: "လၟုဟ်" },
            { w: "သၞဝ်", r: "သၟဝ်" },
            { w: "သၞေဟ်", r: "သၟေဟ်" },
            { w: "ဗၞာ", r: "ဗၟာ" }, // ဗၞာ -> ဗၟာ
            { w: "တၞေၚ်", r: "တၟေင်" }, // တၞေၚ် -> တၟေင်
            
            // အက္ခရ် ဝ/န (ဗွဲ/နွံ)
            { w: "ဗၞဲ", r: "ဗွဲ" },
            { w: "နၞံ", r: "နွံ" },
            { w: "ဒၞါ", r: "ဒွါ" }, // ဒၞါရဝတီ -> ဒွါရဝတီ
            
            // အက္ခရ် ပ္ဍဲ
            { w: "ပ္ကဲ", r: "ပ္ဍဲ" },
            { w: "ပ္လဲ", r: "ပ္ဍဲ" },
            
            // အက္ခရ် တုဲ/ကေုာံ
            { w: "တုဲံ", r: "တုဲ" },
            { w: "ကောံ", r: "ကေုာံ" },
            { w: "ကြံနူ", r: "ကြဴနူ" },

            // အက္ခရ် ဒၟံင်
            { w: "ဒၞံၚ်", r: "ဒၟံင်" },
            { w: "ဒၞၚ်", r: "ဒၟံင်" },
            { w: "ဒၞံင်", r: "ဒၟံင်" },

            // အက္ခရ် တၞဟ်ဟ်
            { w: "ချၚ်", r: "ဍုင်" }, // ချၚ် -> ဍုင် (Common error)
            { w: "ဒ္ဓာဲ", r: "ဒၞာဲ" },
            { w: "ဒံ", r: "ဒဴ" },  // ဒြေပ်ဒံ -> ဒြေပ်ဒဴ
            { w: "သ်ေေ", r: "သှ်ေ" },
            { w: "သ်္သေ့", r: "သှ်ေ" },
            { w: "စက်", r: "ၜက်" }, // သှ်ေစက် -> သှ်ေၜက် (Context)
            { w: "နိဂို", r: "နိဂီု" },
            { w: "ပ္စာန်", r: "ပၞာန်" },
            { w: "ဂှဲ", r: "ဂၠုဲ" }, // ဂှဲ -> ဂၠုဲ
            { w: "စီ", r: "ၜဳ" },  // စီ -> ၜဳ (ဇိုင်စီ -> ဇိုင်ၜဳ)
            { w: "ပှန်", r: "ပၠန်" },
            { w: "ဒ်", r: "ဒှ်" },
            { w: "ရႈ", r: "ရ။" }, // ရႈ -> ရ။
            { w: "ရၟ", r: "ရ။" }
        ];

        // Apply Word Replacements
        replacements.forEach(item => {
            let regex = new RegExp(item.w, "g");
            fixed = fixed.replace(regex, item.r);
        });

        // --- Step B: ပလေဝ် အက္ခရ်သဇိုင် (General Fixes) ---
        fixed = fixed
            .replace(/င/g, "ၚ")  
            .replace(/ၺ/g, "ည")  
            .replace(/ၡ/g, "ၝ")  
            .replace(/ၢ/g, "ၟ")   
            .replace(/ဂ်/g, "ဂှ်")
            .replace(/ျ၈/g, "")
            .replace(/\[/g, "")
            .replace(/\]/g, "")
            .replace(/[0-9]{2,}\s?%/g, "") // Remove percentages if noise
            .trim();

        return fixed;
    }

    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = "ဍဵုခလုတ် 'Scan လိက်' ညိ";
        }
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');

        if (!file) { alert("ရွေးကေတ် ဗီုရုပ်မွဲမွဲညိ"); return; }

        btn.disabled = true;
        status.innerText = "⏳ ဗှ်မံင်လိက်... (Processing)...";
        output.value = "";
        
        try {
            const { data: { text } } = await Tesseract.recognize(
                file,
                'mya', 
                {
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            status.innerText = `⏳ ဗှ်မံင်: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                }
            );
            
            // ကော် Function ပလေဝ်လိက်
            const correctedText = fixMonScript(text);
            
            output.value = correctedText;
            status.innerText = "✅ Scan တုဲဒှ်ရ!";

        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
