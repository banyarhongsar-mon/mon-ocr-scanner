<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR (Debug Version)</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: "Pyidaungsu", sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h2 { color: #b71c1c; text-align: center; }
        textarea { width: 100%; height: 300px; padding: 10px; margin-top: 10px; font-size: 16px; }
        #log-area { 
            background: #000; color: #0f0; 
            font-family: monospace; padding: 10px; 
            height: 150px; overflow-y: scroll; 
            margin-top: 20px; font-size: 12px;
        }
        button { padding: 15px; width: 100%; background: #b71c1c; color: white; border: none; font-size: 18px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR (Debug Mode)</h2>
    <input type="file" id="uploader" accept="image/*">
    <button id="scan-btn" onclick="runOCR()">🚀 SCAN NOW</button>
    
    <h3>Output (လိက်တိတ်ကၠုင်):</h3>
    <textarea id="output"></textarea>
    
    <h3>System Log (စၟဳစၟတ် Error):</h3>
    <div id="log-area">Ready...</div>
</div>

<script>
    function log(msg) {
        const logArea = document.getElementById('log-area');
        logArea.innerHTML += `<div>> ${msg}</div>`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    async function runOCR() {
        const file = document.getElementById('uploader').files[0];
        if (!file) { alert("Please select a file"); return; }
        
        const btn = document.getElementById('scan-btn');
        btn.disabled = true;
        log("Initializing Tesseract...");

        try {
            // Create worker with specific logger
            const worker = await Tesseract.createWorker("mya", 1, {
                logger: m => log(`${m.status}: ${Math.round(m.progress * 100)}%`)
            });
            
            log("Worker created. Recognizing...");
            
            const { data: { text } } = await worker.recognize(file);
            log("Recognition Complete!");
            
            // --- YOUR MON FIX LOGIC ---
            let fixed = text
                .replace(/ကမ္ပန္ဘား/g, "ကမၠောန်")
                .replace(/ကမ္ဘောနိ/g, "ကမၠောန်")
                .replace(/ဟၞံ/g, "ဟွံ")
                .replace(/တဲ်/g, "တုဲ")
                .replace(/ဒ််/g, "ဒှ်");
            // --------------------------

            document.getElementById('output').value = fixed;
            await worker.terminate();

        } catch (error) {
            log("❌ ERROR: " + error.message);
            alert("Error: " + error.message + "\n(Check internet or CORS)");
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
