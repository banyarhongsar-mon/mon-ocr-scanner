<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner (History Fixed)</title>
    <script src='https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js'></script>
    <style>
        :root { --mon-red: #b71c1c; }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 900px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 8px solid var(--mon-red); }
        h2 { color: var(--mon-red); text-align: center; margin-bottom: 20px; }
        .upload-section { border: 2px dashed #ccc; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; background: #fff; cursor: pointer; }
        #preview-image { max-width: 100%; max-height: 300px; margin-top: 10px; display: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        #scan-btn { background-color: var(--mon-red); color: white; }
        #copy-btn { background-color: #28a745; color: white; display: none; }
        #output-text { width: 100%; height: 600px; padding: 20px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; line-height: 2; font-family: "Pyidaungsu", "Mon3", serif; white-space: pre-wrap; }
        .status { text-align: center; color: #555; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon History OCR (Fixed)</h2>
    
    <div class="upload-section" onclick="document.getElementById('uploader').click()">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()" style="display:none">
        <p>📂 ဍဵုဒၞာဲဏအ် သွက်ဂွံရုဲဗီုရုပ် (Click to Upload)</p>
        <img id="preview-image" alt="Preview">
    </div>

    <button id="scan-btn" onclick="performOCR()">Scan & Fix (100% Clean)</button>
    <p id="status" class="status">မင်မံင်ဗီုရုပ်...</p>
    <textarea id="output-text" placeholder="လိက်မန် သ္အးသ္အးဇ္ၚးဇ္ၚး တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
    <button id="copy-btn" onclick="copyToClipboard()">📋 ကူကေတ်လိက် (Copy Text)</button>
</div>

<script>
    function fixMonScript(text) {
        if (!text) return "";
        let fixed = text;

        // ၁. History & Language Dictionary (ပလေဝ်ဝေါဟာရ အတိုင်ဗီုရုပ်မၞး)
        const dictionary = [
            // General Fixes
            { w: "အရေရ်", r: "အရေဝ်" }, { w: "တဲ်", r: "တ္ၚဲ" },
            { w: "လဵာန်", r: "လောန်" }, { w: "သှာံ", r: "သၞာံ" },
            { w: "စိုတ်", r: "စိုပ်" }, // အခိင်စိုပ်
            { w: "ဟီုမာန်", r: "ဟီုမာန်" }, { w: "ဗၞဝ်ကၠံ", r: "ဗွဝ်ကၠံ" }, { w: "ဗၞဝ်ကၠ", r: "ဗွဝ်ကၠံ" },
            { w: "လၞီစ", r: "လွဳစ" }, { w: "အုတဂှ", r: "အိုတ်ဂှ်" },
            { w: "ခေတ်ဒၞါရ", r: "ခေတ်ဒွါရ" }, { w: "ဒၞါရဝတီ", r: "ဒွါရဝတဳ" },
            { w: "လ္စုဟ်", r: "လၟုဟ်" }, { w: "လွုဟ်", r: "လၟုဟ်" },

            // City & Country Names (အဓိက ဒၞာဲဍေံဗၠေတ်)
            { w: "ချၚ်သေံထာဲ", r: "ဍုင်သေံထာဲ" }, { w: "ချၚ်သေံ", r: "ဍုင်သေံ" },
            { w: "ချၚ်လဵ", r: "ဍုင်လဴ" }, { w: "ချၚ်", r: "ဍုင်" },
            { w: "ဗၞာ", r: "ဗၟာ" }, { w: "ဒဲချၚ်", r: "ဒၞာဲဍုင်" },
            
            // Era & Text Terms
            { w: "သမို", r: "သဓီု" }, { w: "တၞာဂလိုၚ်", r: "တၟာဂလိုင်" },
            { w: "စၞတ်သမ္တီ", r: "စၟတ်သမ္တီ" }, { w: "မၞဲခေတ်", r: "မွဲခေတ်" },
            { w: "တှညး", r: "တၠညး" }, { w: "သၞိုၚ်", r: "သၟိင်" },
            { w: "လိက်ကြံနူ", r: "လိက်ကြဴနူ" }, { w: "မန်တၞိ", r: "မန်တၟိ" },
            { w: "မြံသာ်", r: "မြဴသာ်" }, { w: "ဂၞံရ", r: "ဂွံရ" },
            { w: "ရႈ", r: "ရ။" }, { w: "ရ။။", r: "ရ။" }
        ];

        dictionary.forEach(item => {
            let regex = new RegExp(item.w, "g");
            fixed = fixed.replace(regex, item.r);
        });

        // ၂. Standard Cleanups
        fixed = fixed
            .replace(/င/g, "ၚ").replace(/ၺ/g, "ည").replace(/ၡ/g, "ၝ")
            .replace(/ၢ/g, "ၟ").replace(/ွ/g, "ၞ")
            .replace(/ဂ်/g, "ဂှ်").replace(/့/g, "်").replace(/ဲံ/g, "ဲ")
            .replace(/ဴ/g, "ဵ").replace(/ို/g, "ို")
            .replace(/ျ၈/g, "").replace(/\[/g, "").replace(/\]/g, "");

        // ၃. Aggressive Garbage Filter (ပလီုလိက်အကြုက်)
        const lines = fixed.split('\n');
        const cleanLines = lines.filter(line => {
            let s = line.trim();
            if (s.length === 0) return false;
            
            // Remove lines that are mostly numbers or single chars (Like "လာ ၂၂ ၂၂ ၚ္ဆ")
            let validMonChars = (s.match(/[က-အ]/g) || []).length;
            let numbers = (s.match(/[0-9၀-၉]/g) || []).length;
            
            // Rule: If line has few Mon chars but lots of junk/numbers -> Delete
            if (validMonChars < 3 && numbers > 2) return false;
            
            // Rule: Delete very short meaningless lines
            if (s.length < 4) return false;

            return true;
        });

        return cleanLines.join('\n');
    }

    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = "ဗီုရုပ်အောပ်လုပ်တုဲရ၊ ဍဵု Scan ညိ";
        }
    }

    function copyToClipboard() {
        const output = document.getElementById("output-text");
        navigator.clipboard.writeText(output.value).then(() => {
            const btn = document.getElementById("copy-btn");
            btn.innerText = "✅ ကူကေတ်တုဲရ!";
            setTimeout(() => { btn.innerText = "📋 ကူကေတ်လိက် (Copy Text)"; }, 2000);
        });
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');
        const copyBtn = document.getElementById('copy-btn');

        if (!file) { alert("ရွေးဗီုရုပ်မွဲမွဲညိ"); return; }

        btn.disabled = true;
        status.innerText = "⏳ စက်မံင်ပလေဝ်လိက်... (Processing)...";
        output.value = "";
        
        try {
            const { data: { text } } = await Tesseract.recognize(file, 'mya', {
                logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဗှ်မံင်: ${Math.round(m.progress * 100)}%`; }
            });
            
            const result = fixMonScript(text);
            output.value = result;
            
            status.innerText = "✅ Scan တုဲဒှ်ရ! (100% Fixed)";
            copyBtn.style.display = "block";
        } catch (err) {
            status.innerText = "❌ Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
