<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner (Copy Feature)</title>
    <script src='https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js'></script>
    <style>
        :root { 
            --mon-red: #d32f2f; 
            --mon-green: #28a745;
        }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 800px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--mon-red); }
        h2 { color: var(--mon-red); margin-top: 0; text-align: center; }
        .upload-box { border: 2px dashed #bbb; padding: 20px; border-radius: 8px; background: #fff; margin-bottom: 20px; text-align: center; }
        #preview-image { max-width: 100%; max-height: 300px; margin-top: 10px; display: none; }
        
        /* Scan Button */
        button { border: none; padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        #scan-btn { background-color: var(--mon-red); color: white; }
        #scan-btn:hover { background-color: #b71c1c; }
        
        /* Copy Button */
        #copy-btn { background-color: var(--mon-green); color: white; display: none; } /* စကၠာဂှ် ပၞုက်လဝ် */
        #copy-btn:hover { background-color: #218838; }

        button:disabled { background-color: #aaa; cursor: not-allowed; }
        
        #output-text { width: 100%; height: 350px; margin-top: 10px; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; line-height: 1.6; font-family: "Pyidaungsu", "Mon3", serif; }
        .status { font-weight: bold; color: #555; margin: 15px 0; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR Scanner</h2>
    
    <div class="upload-box">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()">
        <br>
        <img id="preview-image" alt="Image Preview">
    </div>

    <button id="scan-btn" onclick="performOCR()">Scan လိက် (Start)</button>
    
    <p id="status" class="status">ဍဵုခလုတ် "Scan လိက်" သွက်ဂွံစ...</p>
    
    <textarea id="output-text" placeholder="လိက်မန် တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
    
    <button id="copy-btn" onclick="copyToClipboard()">📋 ကူကေတ်လိက် (Copy Text)</button>
</div>

<script>

    function fixMonScript(text) {
        if (!text) return "";
        let fixed = text;

        const replacements = [
            { w: "လၞုဟ်", r: "လၟုဟ်" }, { w: "သၞဝ်", r: "သၟဝ်" }, { w: "သၞေဟ်", r: "သၟေဟ်" },
            { w: "ဗၞာ", r: "ဗၟာ" }, { w: "တၞေၚ်", r: "တၟေင်" },
            { w: "ဗၞဲ", r: "ဗွဲ" }, { w: "နၞံ", r: "နွံ" }, { w: "ဒၞါ", r: "ဒွါ" },
            { w: "ပ္ကဲ", r: "ပ္ဍဲ" }, { w: "ပ္လဲ", r: "ပ္ဍဲ" },
            { w: "တုဲံ", r: "တုဲ" }, { w: "ကောံ", r: "ကေုာံ" }, { w: "ကြံနူ", r: "ကြဴနူ" },
            { w: "ဒၞံၚ်", r: "ဒၟံင်" }, { w: "ဒၞၚ်", r: "ဒၟံင်" }, { w: "ဒၞံင်", r: "ဒၟံင်" },
            { w: "ချၚ်", r: "ဍုင်" }, { w: "ဒ္ဓာဲ", r: "ဒၞာဲ" }, { w: "ဒံ", r: "ဒဴ" },
            { w: "သ်ေေ", r: "သှ်ေ" }, { w: "သ်္သေ့", r: "သှ်ေ" }, { w: "စက်", r: "ၜက်" },
            { w: "နိဂို", r: "နိဂီု" }, { w: "ပ္စာန်", r: "ပၞာန်" }, { w: "ဂှဲ", r: "ဂၠုဲ" },
            { w: "စီ", r: "ၜဳ" }, { w: "ပှန်", r: "ပၠန်" }, { w: "ဒ်", r: "ဒှ်" },
            { w: "ရႈ", r: "ရ။" }, { w: "ရၟ", r: "ရ။" }
        ];

        replacements.forEach(item => {
            let regex = new RegExp(item.w, "g");
            fixed = fixed.replace(regex, item.r);
        });

        fixed = fixed
            .replace(/င/g, "ၚ").replace(/ၺ/g, "ည").replace(/ၡ/g, "ၝ")
            .replace(/ၢ/g, "ၟ").replace(/ဂ်/g, "ဂှ်")
            .replace(/ျ၈/g, "").replace(/\[/g, "").replace(/\]/g, "")
            .replace(/[0-9]{2,}\s?%/g, "").trim();

        return fixed;
    }
