<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner - စက်ဗှ်လိက်မန်</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    
    <style>
        :root {
            --mon-red: #d32f2f;
            --mon-gold: #ffc107;
        }
        body {
            font-family: "Pyidaungsu", "Mon3", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            max-width: 700px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid var(--mon-red);
        }
        h1 { color: var(--mon-red); margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; }
        
        .upload-section {
            border: 2px dashed #ccc;
            padding: 20px;
            border-radius: 10px;
            background: #fafafa;
            margin-bottom: 20px;
        }
        
        #preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        button {
            background-color: var(--mon-red);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background-color: #b71c1c; transform: translateY(-2px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #result-area { margin-top: 25px; text-align: left; }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            font-family: "Pyidaungsu", "Mon3", serif;
            font-size: 18px;
            border: 2px solid #eee;
            border-radius: 10px;
            resize: vertical;
            box-sizing: border-box;
        }
        .status-msg { margin: 10px 0; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔎 Mon OCR Scanner</h1>
    <p class="subtitle">စက်ဗှ်လိက်မန် နူဗီုရုပ် (Mon Optical Character Recognition)</p>

    <div class="upload-section">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()">
        <center><img id="preview-image" alt="Preview"></center>
    </div>

    <button id="scan-btn" onclick="performOCR()">Scan လိက် (ဗှ်ကေတ်)</button>

    <div id="result-area">
        <p id="status" class="status-msg"></p>
        <textarea id="output-text" placeholder="လိက်မန် မဗှ်ဂွံတအ် တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
    </div>
    
    <p style="font-size: 12px; color: #999; margin-top: 20px;">Developed for Mon Language Study</p>
</div>

<script>
    // နဲကဲပလေဝ်အက္ခရ်မန် (Mapping Burmese-style OCR to Mon script)
    function fixMonScript(text) {
        const monMap = {
            "င": "ၚ", // Nga
            "ၺ": "ည", // Nya
            "ၡ": "ၝ", // Mbba
            "ၚ်": "င်", // Fix potential nasal issues
            "ဒှ်": "ဒှ်", // Common word check
        };

        let fixedText = text;
        for (let key in monMap) {
            let regex = new RegExp(key, 'g');
            fixedText = fixedText.replace(regex, monMap[key]);
        }
        return fixedText;
    }

    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
        }
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');

        if (!file) {
            alert("ဂရုစွံတုဲ ရွေးကေတ် ဗီုရုပ်မွဲမွဲ ကၠာညိအဴ။");
            return;
        }

        btn.disabled = true;
        status.innerText = "⏳ မင်မွဲချိုန်ခဏ... စက်မံင်ဗှ်လိက် (Processing)...";
        output.value = "";

        try {
            const worker = await Tesseract.createWorker('mya'); // စကာ mya သွက်အက္ခရ်သဇိုင်
            const { data: { text } } = await worker.recognize(file);
            
            // စကာ Function ပလေဝ်လိက်မန်
            const correctedText = fixMonScript(text);
            
            output.value = correctedText;
            status.innerText = "✅ Scan တုဲဒှ်ရ!";
            await worker.terminate();
        } catch (err) {
            console.error(err);
            status.innerText = "❌ ဗၠေတ်မံင်ညိ! စမ်မွဲဝါပၠန်ညိ။";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
