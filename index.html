<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner (Dhamma Fix)</title>
    <script src='https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js'></script>
    <style>
        :root { --mon-red: #d32f2f; --mon-green: #28a745; }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 900px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--mon-red); }
        h2 { color: var(--mon-red); margin-top: 0; text-align: center; }
        .upload-box { border: 2px dashed #bbb; padding: 20px; border-radius: 8px; background: #fff; margin-bottom: 20px; text-align: center; }
        #preview-image { max-width: 100%; max-height: 300px; margin-top: 10px; display: none; }
        
        button { border: none; padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        #scan-btn { background-color: var(--mon-red); color: white; }
        #copy-btn { background-color: var(--mon-green); color: white; display: none; } 
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        
        #output-text { width: 100%; height: 450px; margin-top: 10px; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; line-height: 1.6; font-family: "Pyidaungsu", "Mon3", serif; }
        .status { font-weight: bold; color: #555; margin: 15px 0; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR Scanner (Dhamma Fix)</h2>
    <div class="upload-box">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()">
        <br>
        <img id="preview-image" alt="Image Preview">
    </div>
    <button id="scan-btn" onclick="performOCR()">Scan လိက် (Start)</button>
    <p id="status" class="status">ဍဵုခလုတ် "Scan လိက်" သွက်ဂွံစ...</p>
    <textarea id="output-text" placeholder="လိက်မန် တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
    <button id="copy-btn" onclick="copyToClipboard()">📋 ကူကေတ်လိက် (Copy)</button>
</div>

<script>
    function fixMonScript(text) {
        if (!text) return "";
        let fixed = text;

        // --- ၁. ပလေဝ် မအရေဝ်ဓရ်/ကဗျ (Poem & Dhamma Specific Fixes) ---
        const replacements = [
            // Segment 1
            { w: "သာဝွ္ဗကုသုက", r: "သာ်ဝွံကုသဵုကံ" },
            { w: "ကျာတွဟ္ဝတာပ", r: "ကျာ်တွံဟွံတာပ်" },
            { w: "သရာံပါပ်လလဴ", r: "သရာံပါပ်လလံ" },
            { w: "ချတပွဗှးအ", r: "ချိုတ်ဂွံဗၠးအ" },
            { w: "ဟောဒါံ", r: "ဟောံ ဒါန်" },
            { w: "နရောၚဒ္ဝ္ဝာ", r: "နရောင်ဒှ်တံ" },
            { w: "ဇသမ္မယုတ", r: "ဇဴသမ္မယုတ်" },
            { w: "ဟနကနဗ္ဗာန", r: "ဟနိက်နိဗ္ဗာန်" },

            // Segment 2
            { w: "ရာနလ္ပဟဂုဟ", r: "ရာန်လ္ပဟဂုဟ်" },
            { w: "ဆာနကၠုၚလသေ", r: "ဆာန်ကၠုင်လဴသေဲ" },
            { w: "မၚပထေတုတ", r: "မိင်ပထေဲတုတ်" },
            { w: "ဗျုဝွော", r: "ဗျုဇၞော်" },
            { w: "အာဠုၚ", r: "အာပ္ညုင်" },
            { w: "လအပု၀ဂ္ဂအုတ", r: "လအ်ပုင်ဂွဳအုတ်" },
            { w: "တ်ဇဝပှုတ", r: "တ္ၚဲဇိဝိပၠိုတ်" },
            { w: "ချုတအာညးခုတ", r: "ချိုတ်အာညးခုတ်" },

            // Segment 3
            { w: "ဂြိုပ်", r: "ဂြိုပ်" },
            { w: "ဒ:ဂှံၚ်လုတ်", r: "ဒးဂၠံင်လုတ်" },
            { w: "ပ္က်ခန္ဓပ္နိုတ်", r: "ပ္ဍဲခန္ဓပၠိုတ်" }, // ပ္က် -> ပ္ဍဲ
            { w: "ဒပြိုတ်ဒ်ဘုတ်", r: "ဒှ်ပြိုတ်ဒှ်ဘုတ်" },
            { w: "သှးလဝ၀စာဂ", r: "သၠးလဝ်စာဂ" },
            { w: "ဗျုဗျူမာမာ", r: "ဗျုဗျုမာဲမာဲ" },
            { w: "ဗှာဗှာဝုတစုတ", r: "ဗၠာဲဗၠာဲဝုတ်ဝုတ်" }, // ဗှာ -> ဗၠာဲ
            { w: "မၚပထေခုတ", r: "မိင်ပထေဲခုတ်" },
            { w: "ပုတစုတအုတည", r: "ပုတ်စုတ်အိုတ်ညိ" },

            // Segment 4
            { w: "တြံ", r: "တြဴ" },
            { w: "သတုဲ", r: "သတုံ" },
            { w: "တှုၚ်", r: "တၠုင်" },
            { w: "နုၚ်က္ကဓိ", r: "နုင်ဣဓိ" },
            { w: "တောပညၚဗောဓကဓု", r: "တောပ်ညံင်ဗောဓိကဓုံ" },
            { w: "တ်စ္ဝအာ", r: "တ္ၚဲစုတိအာ" },
            { w: "ကုသုန္ဂ", r: "ကုသဵုနွံ" },

            // Segment 5
            { w: "ချီတာကှေံ", r: "ချဳတာကၠေံ" }, // ကှေံ -> ကၠေံ
            { w: "ပှန်အပါပိုန်ဘုံ", r: "ပၠန်အပဲါပိုန်ဘုံ" },
            { w: "ပ္ဍဲ်သွိၚ်သရုံ", r: "ပ္ဍဲသၞိင်သဓုံ" }, // သွိၚ် -> သၞိင်
            { w: "ဗြိုဒေ", r: "ဗြီုဒေ" },
            
            // Segment 6
            { w: "ဝွံႆပလဝ်", r: "ဂွံပလဝ်" },
            { w: "ရမ်သွိက်", r: "ရမ်သၟိက်" }, // သွိက် -> သၟိက်
            { w: "ဒ်ှဟဒိုန်သွိၚ်", r: "ဒှ်ဟဒိုန်သၟိင်" },
            { w: "တွံသကဵုန်လဝ်", r: "တွံသကိုန်လဝ်" },

            // General Fixes (ပလေဝ်အက္ခရ်ဓမ္မတာ)
            { w: "သွိၚ်", r: "သၟိင်" }, 
            { w: "သွိက်", r: "သၟိက်" },
            { w: "ဗှာ", r: "ဗၠာဲ" },
            { w: "ပှန်", r: "ပၠန်" },
            { w: "ကှေံ", r: "ကၠေံ" },
            { w: "ဒ်ှ", r: "ဒှ်" }, 
            { w: "ဒ်", r: "ဒှ်" },
            { w: "ရႈ", r: "ရ။" }
        ];

        replacements.forEach(item => {
            let regex = new RegExp(item.w, "g");
            fixed = fixed.replace(regex, item.r);
        });

        // --- ၂. သ္အးပလီုထောံ လိက်အု (Remove Noise Lines) ---
        fixed = fixed
            .replace(/[.]{2,}/g, "") // ..
            .replace(/\(. န ၀ 0./g, "") 
            .replace(/ါရီရဆေခြခြေ ခြောၚ် ဆမာ ဤမြေ/g, "")
            .replace(/ၚ ကြခ ြ၁ပြခြုခြ ၆၁ ကြၚြမြဏြ/g, "")
            .replace(/\s{3,}/g, "\n"); // Keep lines separated

        // --- ၃. ပလေဝ် အက္ခရ်သဇိုင် (Standard Fixes) ---
        fixed = fixed
            .replace(/င/g, "ၚ").replace(/ၺ/g, "ည").replace(/ၡ/g, "ၝ")
            .replace(/ၢ/g, "ၟ").replace(/ဂ်/g, "ဂှ်")
            .replace(/့/g, "်").replace(/ဲံ/g, "ဲ")
            .trim();

        return fixed;
    }

    function copyToClipboard() {
        const output = document.getElementById("output-text");
        const copyBtn = document.getElementById("copy-btn");
        output.select();
        output.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(output.value).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "✅ ကူကေတ်တုဲရ!";
            setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
        });
    }

    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        const copyBtn = document.getElementById('copy-btn');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = "ဍဵုခလုတ် 'Scan လိက်' ညိ";
            copyBtn.style.display = "none";
        }
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');
        const copyBtn = document.getElementById('copy-btn');

        if (!file) { alert("ရွေးကေတ် ဗီုရုပ်မွဲမွဲညိ"); return; }

        btn.disabled = true;
        status.innerText = "⏳ ဗှ်မံင်လိက်... (Processing)...";
        output.value = "";
        
        try {
            const { data: { text } } = await Tesseract.recognize(
                file, 'mya', 
                { logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဗှ်မံင်: ${Math.round(m.progress * 100)}%`; }}
            );
            
            const correctedText = fixMonScript(text);
            output.value = correctedText;
            
            status.innerText = "✅ Scan တုဲဒှ်ရ!";
            copyBtn.style.display = "block";

        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
