<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner (Ultimate Fix)</title>
    <script src='https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js'></script>
    <style>
        :root { 
            --mon-red: #d32f2f; 
            --mon-green: #28a745;
        }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 900px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--mon-red); }
        h2 { color: var(--mon-red); margin-top: 0; text-align: center; }
        .upload-box { border: 2px dashed #bbb; padding: 20px; border-radius: 8px; background: #fff; margin-bottom: 20px; text-align: center; }
        #preview-image { max-width: 100%; max-height: 300px; margin-top: 10px; display: none; }
        
        button { border: none; padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        #scan-btn { background-color: var(--mon-red); color: white; }
        #copy-btn { background-color: var(--mon-green); color: white; display: none; } 

        button:disabled { background-color: #aaa; cursor: not-allowed; }
        
        #output-text { width: 100%; height: 400px; margin-top: 10px; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; line-height: 1.6; font-family: "Pyidaungsu", "Mon3", serif; }
        .status { font-weight: bold; color: #555; margin: 15px 0; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR Scanner (Ultimate Fix)</h2>
    <div class="upload-box">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()">
        <br>
        <img id="preview-image" alt="Image Preview">
    </div>
    <button id="scan-btn" onclick="performOCR()">Scan လိက် (Start)</button>
    <p id="status" class="status">ဍဵုခလုတ် "Scan လိက်" သွက်ဂွံစ...</p>
    <textarea id="output-text" placeholder="လိက်မန် တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
    <button id="copy-btn" onclick="copyToClipboard()">📋 ကူကေတ်လိက် (Copy)</button>
</div>

<script>
    // ၁. Function ပလေဝ်လိက် (Ultimate Dictionary Logic)
    function fixMonScript(text) {
        if (!text) return "";
        let fixed = text;

        // --- Step A: ပလေဝ် မအရေဝ် အတိုင်မၞးကဵုလဝ် (Word Replacement) ---
        const replacements = [
            // အက္ခရ် နှ (ွ) ကဵု မ (ၟ) ကဵု န (ၞ)
            { w: "လွိုဟ်", r: "လၟိဟ်" }, { w: "လွုဟ်", r: "လၟုဟ်" },
            { w: "သြသတြော", r: "သြသတြေ" }, { w: "ညးဂူ", r: "ညးဂူ" }, 
            { w: "ဒတံ", r: "ဒတဴ" }, { w: "အဂွဲ", r: "အဂၞဲ" }, 
            { w: "ဓလို", r: "ဓလီု" }, { w: "ဖှိုက်", r: "ဖ္ဍိုက်" },
            { w: "ဒွၚ်", r: "ဒၟံင်" }, { w: "ဒ္ခံၚ်", r: "ဒၟံင်" }, { w: "ဒွံၚ်", r: "ဒၟံင်" },
            { w: "ဆို", r: "ဆဵု" }, { w: "ကို", r: "ကဵု" },
            { w: "မွိဟ်", r: "မၞိဟ်" }, { w: "မှိုဟ်", r: "မၞိဟ်" },
            { w: "အဂ္တဲ", r: "အဂၞဲ" }, { w: "ဂမှိုၚ်", r: "ဂမၠိုင်" },
            { w: "ဇွော်", r: "ဇၞော်" }, { w: "မောဝ်", r: "မောဝ်" },
            { w: "ဂကေုာံ", r: "ဂကောံ" }, { w: "တုံ", r: "တုဲ" },
            { w: "ချၚ်", r: "ဍုင်" }, { w: "ဗွာ", r: "ဗၟာ" }, { w: "လံ", r: "လဴ" },
            { w: "စွတ်", r: "စၟတ်" }, { w: "ကှောန်", r: "ကၠောန်" }, { w: "အခို", r: "အခိုက်" },
            { w: "ကွာ", r: "ကၞာ" }, { w: "သွာၚ်", r: "သၞာင်" }, { w: "ဂှိုၚ်", r: "ဂၠိုင်" },
            { w: "လ္ဂုၚ်ႈ", r: "လ္ဂုင်၊" }, { w: "စၚ်ကံက်", r: "ၜင်ကံက်" },
            { w: "သွိၚ်တှ", r: "သၟိင်တၠ" }, { w: "လွှဟ်", r: "လၟုဟ်" },
            { w: "ဂ္ကဲ", r: "ပ္ဍဲ" }, { w: "ပှဲ့", r: "ပ္ဍဲ" }, { w: "ပ္ကဲ", r: "ပ္ဍဲ" },
            { w: "ထဲရာမာဉ်", r: "ထာဲရာမာဉ်" }, { w: "မွး", r: "မ္ဂး" },
            { w: "စိုန်", r: "ၜိုန်" }, { w: "တ္ဒုၚ်", r: "တၠုင်" }, { w: "ကှို", r: "ကၠို" }
        ];

        replacements.forEach(item => {
            let regex = new RegExp(item.w, "g");
            fixed = fixed.replace(regex, item.r);
        });

        // --- Step B: ပလေဝ် အက္ခရ်သဇိုင် (Common Fixes) ---
        fixed = fixed
            // ပလေဝ် သရာဲ (ဲ) ကဵု ရပင့် (ြ)
            .replace(/ဲံ/g, "ဲ") 
            .replace(/့/g, "်") // အောက်မြစ် -> အသတ်
            .replace(/ႈ/g, "၊") // ရှ -> ၊
            .replace(/#/g, "။")
            .replace(/%/g, "။")
            
            // ပလေဝ် ၚ/ည/ၝ
            .replace(/င/g, "ၚ").replace(/ၺ/g, "ည").replace(/ၡ/g, "ၝ")
            .replace(/ၢ/g, "ၟ").replace(/ဂ်/g, "ဂှ်")
            
            // Remove Noise
            .replace(/[0-9]{2,}\s?%/g, "")
            .replace(/_/g, "").replace(/\[/g, "").replace(/\]/g, "")
            .trim();

        return fixed;
    }

    function copyToClipboard() {
        const output = document.getElementById("output-text");
        const copyBtn = document.getElementById("copy-btn");
        output.select();
        output.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(output.value).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "✅ ကူကေတ်တုဲရ!";
            setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
        });
    }

    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        const copyBtn = document.getElementById('copy-btn');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = "ဍဵုခလုတ် 'Scan လိက်' ညိ";
            copyBtn.style.display = "none";
        }
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');
        const copyBtn = document.getElementById('copy-btn');

        if (!file) { alert("ရွေးကေတ် ဗီုရုပ်မွဲမွဲညိ"); return; }

        btn.disabled = true;
        status.innerText = "⏳ ဗှ်မံင်လိက်... (Processing)...";
        output.value = "";
        
        try {
            const { data: { text } } = await Tesseract.recognize(
                file, 'mya', 
                { logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဗှ်မံင်: ${Math.round(m.progress * 100)}%`; }}
            );
            
            const correctedText = fixMonScript(text);
            output.value = correctedText;
            
            status.innerText = "✅ Scan တုဲဒှ်ရ!";
            copyBtn.style.display = "block";

        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
