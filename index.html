<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner - ဗညာဟံသာ (Latest Version)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; background: #eef2f3; padding: 20px; text-align: center; }
        .main-card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        #image-preview { width: 100%; border-radius: 10px; margin-bottom: 15px; display: none; border: 2px solid #ddd; }
        .upload-btn { background: #1abc9c; color: white; padding: 12px 25px; border: none; border-radius: 30px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .upload-btn:hover { background: #16a085; }
        #status { margin: 15px 0; color: #7f8c8d; font-weight: bold; }
        #result-area { width: 100%; height: 180px; margin-top: 15px; padding: 12px; border: 1.5px solid #bdc3c7; border-radius: 8px; font-size: 17px; background: #fafafa; line-height: 1.8; }
    </style>
</head>
<body>

<div class="main-card">
    <h2>Mon OCR Scanner 🇲🇳</h2>
    <p>Scan လိခ်မန်တုဲ AI ဘိုၚ်ပလေဝ်ကဵု</p>

    <input type="file" id="image-input" accept="image/*" style="display:none">
    <button class="upload-btn" onclick="document.getElementById('image-input').click()">ရုဲစှ်ရုပ် (Select Image)</button>

    <div id="status">အဆေအ်မံၚ်... (Ready)</div>
    <img id="image-preview" src="">
    
    <textarea id="result-area" placeholder="လိခ် Scan တုဲတအ်ဏအ် မံၚ်ဒၞာဲဏအ်ရ..."></textarea>
</div>

<script>
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('result-area');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // ထ္ၜးရုပ် Preview
        imagePreview.src = URL.createObjectURL(file);
        imagePreview.style.display = 'block';
        
        status.innerText = "စၟဳစၟတ်မံၚ်... (Scanning...)";
        resultArea.value = "";

        try {
            // စသုၚ်စောဲ Tesseract v5
            const { data: { text } } = await Tesseract.recognize(file, 'mya', {
                logger: m => {
                    if (m.status === 'recognizing text') {
                        status.innerText = `Scan မံၚ်: ${Math.round(m.progress * 100)}%`;
                    }
                }
            });

            // သုၚ်စောဲ Logic မဘိုၚ်ပလေဝ်လိခ်မန် (Mon Correction Logic)
            const cleanedText = fixMonScript(text);
            resultArea.value = cleanedText;
            status.innerText = "တုဲဒှ်ရ! (Success)";

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
            alert("Error: Tesseract is not defined (Check Internet or CORS)");
        }
    });

    // ဏအ်ဂှ် ဒှ် Logic မဘိုၚ်ပလေဝ်အက္ခရ်မန် မဗၠေတ်ဂၠိုၚ်အိုတ်
    function fixMonScript(input) {
        return input
            .replace(/င/g, "ၚ")         // ဗၟာ 'င' ဂှ် ပြံၚ်ကဵု 'ၚ'
            .replace(/ၚ်/g, "ၚ်")        // ပလေဝ် Nga-Gak (Unicode Sequence)
            .replace(/ၞ/g, "ၞ")         // Na-Hta (Ensure Mon Unicode)
            .replace(/ၟ/g, "ၟ")         // Ma-Hta
            .replace(/ှ/g, "ှ")         // Ha-Htoe
            .replace(/ြ/g, "ြ")         // Ya-Yit
            .replace(/ု/g, "ု")         // U
            .replace(/ူ/g, "ူ");        // UU
    }
</script>

</body>
</html>
