<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner - ဗညာဟံသာ</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        #preview { width: 100%; max-height: 300px; margin-top: 10px; display: none; border-radius: 8px; }
        .btn-group { margin: 20px 0; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2980b9; }
        #output { width: 100%; height: 200px; margin-top: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; line-height: 1.6; }
        .status { color: #e67e22; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mon OCR Scanner</h1>
    <p>ဓရီုကျာကဵု AI တုဲ ကလေၚ်စပရောဂျေတ်မန်</p>
    
    <input type="file" id="file-input" accept="image/*" style="display:none">
    <div class="btn-group">
        <button onclick="document.getElementById('file-input').click()">ရုဲစှ်ရုပ် (Pick Image)</button>
    </div>

    <img id="preview" alt="Preview">
    <div id="status" class="status"></div>
    
    <textarea id="output" placeholder="လိခ်မန် Scan တုဲတအ်ဏအ် မံၚ်ဒၞာဲဏအ်ရ..."></textarea>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    fileInput.onchange = e => {
        const file = e.target.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            recognizeText(file);
        }
    };

    async function recognizeText(file) {
        status.innerText = "စၟဳစၟတ်မံၚ်လိခ်... (Processing)";
        
        // သုၚ်စောဲ Tesseract နကဵုဘာသာဗၟာ (Burmese) ကၠာ 
        // တုဲမ္ဂး ပိုဲကလေၚ်ပလေဝ်နကဵု Logic မန်
        const worker = await Tesseract.createWorker('mya'); 
        const { data: { text } } = await worker.recognize(file);
        
        // Mon Script Correction Logic
        let monText = fixMonScript(text);
        
        output.value = monText;
        status.innerText = "တုဲဒှ်ရ! (Finished)";
        await worker.terminate();
    }

    function fixMonScript(rawText) {
        return rawText
            .replace(/င/g, "ၚ")      // Burmese Nga to Mon Nga
            .replace(/ၚ်/g, "ၚ်")     // Ensure correct Nga-Gak
            .replace(/း/g, "း")       // Visarga
            .replace(/၀/g, "၀");      // Zero
            // ဗှ်ေထပ်စုတ် Logic ဗၠေတ်ဗၠေတ် ဒၞာဲဏအ်ဂွံတွဵုရ
    }
</script>

</body>
</html>
