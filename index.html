<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner Pro</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        :root { --mon-red: #d32f2f; }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 800px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--mon-red); }
        h2 { color: var(--mon-red); margin-top: 0; }
        .upload-box { border: 2px dashed #bbb; padding: 20px; border-radius: 8px; background: #fff; margin-bottom: 20px; position: relative; }
        #preview-image { max-width: 100%; border-radius: 5px; margin-top: 10px; display: none; filter: grayscale(100%) contrast(150%); }
        button { background-color: var(--mon-red); color: white; border: none; padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; }
        button:disabled { background-color: #aaa; }
        #output-text { width: 100%; height: 300px; margin-top: 20px; padding: 15px; font-size: 17px; border: 1px solid #ddd; border-radius: 8px; line-height: 1.6; }
        .status { font-weight: bold; color: #555; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR Scanner (Improved)</h2>
    <p>ပလေဝ်လဝ် သွက်ဂွံ Scan လိက်မန် ကၠးကၠး</p>

    <div class="upload-box">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()">
        <center><img id="preview-image" id="target-img"></center>
    </div>

    <button id="scan-btn" onclick="performOCR()">စ Scan လိက် (Start Scanning)</button>
    
    <p id="status" class="status"></p>
    <textarea id="output-text" placeholder="လိက်မန် မဗှ်ဂွံတအ် တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
</div>

<script>
    // နဲကဲပလေဝ်အက္ခရ် (Post-processing)
    function cleanMonText(text) {
        return text
            .replace(/င/g, "ၚ")
            .replace(/ၺ/g, "ည")
            .replace(/ၡ/g, "ၝ")
            .replace(/[|] /g, "") // ပလေဝ်သင်္ကေတလိုင်း
            .replace(/[0-9@#$%^&*]/g, "") // ပ္ဍဲဒၞာဲမန်ဇေတ်ဇေတ် ယဝ်ရသင်္ချာပါမ္ဂး ပလီုထောံ
            .trim();
    }

    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
        }
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');

        if (!file) { alert("ရွေးကေတ် ဗီုရုပ်မွဲမွဲညိ"); return; }

        btn.disabled = true;
        status.innerText = "⏳ စက်မံင်ဗှ်လိက်မန် (Processing Mon Script)...";
        
        try {
            // စကာ Worker နကဵု Configuration တၟေင်
            const worker = await Tesseract.createWorker('mya', 1, {
                logger: m => {
                    if(m.status === 'recognizing text') {
                        status.innerText = `⏳ ဗှ်မံင်လိက်: ${Math.round(m.progress * 100)}%`;
                    }
                }
            });

            const { data: { text } } = await worker.recognize(file);
            
            // ပလေဝ်လိက် ညံင်ဂွံဒှ်မန်
            const result = cleanMonText(text);
            output.value = result;
            
            status.innerText = "✅ Scan တုဲဒှ်ရ!";
            await worker.terminate();
        } catch (err) {
            status.innerText = "❌ Error: " + err;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
