<!DOCTYPE html>
<html lang="mnw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon OCR Scanner (Fast)</title>
    <script src='https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js'></script>
    <style>
        :root { --mon-red: #d32f2f; }
        body { font-family: "Pyidaungsu", "Mon3", sans-serif; background-color: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 800px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--mon-red); }
        h2 { color: var(--mon-red); margin-top: 0; text-align: center; }
        .upload-box { border: 2px dashed #bbb; padding: 20px; border-radius: 8px; background: #fff; margin-bottom: 20px; text-align: center; }
        #preview-image { max-width: 100%; max-height: 300px; margin-top: 10px; display: none; }
        button { background-color: var(--mon-red); color: white; border: none; padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        #output-text { width: 100%; height: 250px; margin-top: 20px; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; line-height: 1.6; font-family: "Pyidaungsu", "Mon3", serif; }
        .status { font-weight: bold; color: #555; margin: 15px 0; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Mon OCR Scanner</h2>
    
    <div class="upload-box">
        <input type="file" id="uploader" accept="image/*" onchange="previewImage()">
        <br>
        <img id="preview-image" alt="Image Preview">
    </div>

    <button id="scan-btn" onclick="performOCR()">Scan လိက် (Start)</button>
    
    <p id="status" class="status">ဍဵုခလုတ် "Scan လိက်" သွက်ဂွံစ...</p>
    <textarea id="output-text" placeholder="လိက်မန် တိတ်ကၠုင်ဒၞာဲဏအ်ရ..."></textarea>
</div>

<script>
    // ၁. Function ပလေဝ်လိက် (Auto-Correction)
    function fixMonScript(text) {
        if (!text) return "";
        return text
            .replace(/င/g, "ၚ")  // Mon Nga
            .replace(/ၺ/g, "ည")  // Mon Nya
            .replace(/ၡ/g, "ၝ")  // Mon Mbba
            .replace(/ၢ/g, "ၟ")   // Mon Hma
            .replace(/ွ/g, "ၞ")   // Mon Na
            .replace(/[0-9@#$%^&*<>]/g, " ") 
            .trim();
    }

    function previewImage() {
        const file = document.getElementById('uploader').files[0];
        const preview = document.getElementById('preview-image');
        if (file) {
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = "ဍဵုခလုတ် 'Scan လိက်' ညိ";
        }
    }

    async function performOCR() {
        const file = document.getElementById('uploader').files[0];
        const status = document.getElementById('status');
        const output = document.getElementById('output-text');
        const btn = document.getElementById('scan-btn');

        if (!file) { alert("ရွေးကေတ် ဗီုရုပ်မွဲမွဲညိ"); return; }

        // Disable button to prevent double click
        btn.disabled = true;
        btn.innerText = "မင်မွဲချိုန်ခဏ...";
        status.innerText = "⏳ စက်မံင် Download Data (mya)...";
        output.value = "";
        
        try {
            // စကာ Tesseract.recognize (နဲကဲလောဲအိုတ်)
            // 'mya' = Myanmar Language (Stable)
            const { data: { text } } = await Tesseract.recognize(
                file,
                'mya', 
                {
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            status.innerText = `⏳ ဗှ်မံင်လိက်: ${Math.round(m.progress * 100)}%`;
                        } else {
                            status.innerText = "⏳ " + m.status;
                        }
                    }
                }
            );
            
            // ပလေဝ်လိက်
            const correctedText = fixMonScript(text);
            
            output.value = correctedText;
            status.innerText = "✅ Scan တုဲဒှ်ရ!";

        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error: " + err.message;
            alert("ဗၠေတ်မံင်ညိ! Internet connection ခိုဟ်ဟာ စၟဳစၟတ်ညိ။");
        } finally {
            btn.disabled = false;
            btn.innerText = "Scan လိက် (Start)";
        }
    }
</script>

</body>
</html>
